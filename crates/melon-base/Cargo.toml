[package]
name = "melon-base"
version = "0.1.2"
authors = ["Zinedin Polic"]
edition = "2024"
rust-version = "1.100.0"
description = "What the Melon client and the Melon launcher share: accounts, folders, asset preparation, and the 2D Vulkan base"
repository = "https://github.com/zinedinp/Melon-Client"
license = "GPL-3.0"

[dependencies]
anyhow.workspace = true
arboard.workspace = true
ash.workspace = true
ash-window.workspace = true
image.workspace = true
majestix-vk.workspace = true
numerobis.workspace = true
open.workspace = true
raw-window-handle.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
ureq.workspace = true
uuid.workspace = true
winit.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
# The Credential Manager keeps the account tokens.
windows-sys = { workspace = true, features = ["Win32_Security_Credentials"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The login Keychain keeps the account tokens.
security-framework = "3.7.0"

[lints]
workspace = true
