# Pumpkin's generated data tables can overflow rustc's default stack when
# they are optimized. Only rustc needs it: `cargo run` hands it to the game
# too, and the game's and the examples' `main` drop it there
# (`melon::platform::drop_cargo_stack`). `cargo test` keeps it: the harness
# spawns its threads before a test runs, and std reads it only once.
[env]
RUST_MIN_STACK = "268435456"

# lld links much faster than the default linker
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# Links the MinGW runtimes statically. Otherwise melon.exe needs a libstdc++-6.dll (shaderc)
# and Windows takes whichever one is on PATH (Git's, for example), which may lack symbols.
# `+crt-static` covers only libgcc and winpthread: rustc ends its library list with `-Bdynamic`,
# so the `-lstdc++` the g++ driver appends goes dynamic unless `-static-libstdc++` is given too.
[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=-static-libstdc++"]
