[package]
name = "melon-base"
version = "0.1.1"
authors = ["Zinedin Polic"]
edition = "2024"
rust-version = "1.100.0"
description = "What the Melon client and the Melon launcher share: accounts, folders, asset preparation, and the 2D Vulkan base"
repository = "https://github.com/zinedinp/Melon-Client"
license = "GPL-3.0"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
ash = "0.38.0"
ash-window = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
# The GPU's vendor and architecture from its PCI ids, for vendor paths at run time.
numerobis = { version = "0.5.0", default-features = false, features = ["vulkan"] }
open = "5.4.5"
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "json"] }
uuid = { version = "1.29.3", features = ["v3", "v4", "v5"] }
winit = "0.30.13"
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
# The Credential Manager keeps the account tokens.
windows-sys = { version = "0.61.2", features = ["Win32_Security_Credentials"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The login Keychain keeps the account tokens.
security-framework = "3.7.0"
